id: kolon-polip
baslik: Kolorektal polip / polipektomi (pT1 karsinom dahil)
organ: Kolorektal
materyal: Biyopsi / polipektomi
kaynaklar:
  - "CAP — Colon and Rectum (Polypectomy / Local Excision, invaziv karsinom içeren polip)"
  - "RCPath — Dataset for colorectal cancer (lokal eksizyon bölümü); BSG/ACPGBI pT1 kılavuzu"
  - "WHO Sindirim Sistemi Tümörleri, 5. baskı (2019); Haggitt / Kikuchi"
tani_alternatif: true
tani:
  - "Tübüler adenom, düşük dereceli displazi; {yer}, {islem}"
  - "Tübülovillöz adenom, düşük / yüksek dereceli displazi; {yer}, {islem}"
  - "Villöz adenom, düşük / yüksek dereceli displazi; {yer}, {islem}"
  - "Sesil serrated lezyon, displazisiz / displazili; {yer}, {islem}"
  - "Geleneksel serrated adenom; {yer}, {islem}"
  - "Hiperplastik polip; {yer}, {islem}"
  - "İnflamatuar polip; {yer}, {islem}"
  - "Adenom zemininde invaziv adenokarsinom, lütfen epikrizi okuyunuz; {yer}, {islem}"
epikriz:
  - {id: yer, etiket: Yer, seviye: 0, gizli: true, tip: metin}
  - {id: islem, etiket: İşlem, seviye: 0, gizli: true, tip: secim, secenekler: [polipektomi, endoskopik mukozal rezeksiyon, endoskopik submukozal diseksiyon, endoskopik biyopsi]}
  - {id: boyut, etiket: Polip boyutu, seviye: 1, tip: olcu, birim: mm, kalip: "… mm (makroskopik / endoskopik bildirim)"}
  - {id: butunluk, etiket: Materyal bütünlüğü, seviye: 1, tip: secim, secenekler: [Bütün (en bloc), Parçalı (piecemeal), Belirlenemedi]}
  - {id: displazi, etiket: Displazi derecesi, seviye: 1, tip: secim, secenekler: [Düşük dereceli, Yüksek dereceli, Uygulanmaz]}
  - {id: sinir_ad, etiket: Polipektomi tabanı / kenarı, seviye: 1, tip: secim, secenekler: ["Displazi görülmedi", "Displazi tabana/kenara ulaşıyor", "Değerlendirilemedi (parçalı / yanık artefaktı)"]}
  - id: karsinom
    etiket: İnvaziv karsinom
    seviye: 1
    tip: secim
    secenekler: [Görülmedi, Görüldü]
    alt:
      - {id: k_tip, etiket: Histolojik tip, seviye: 1, tip: secim, serbest: true, secenekler: [Adenokarsinom, Müsinöz adenokarsinom, "…"], kosul: "karsinom == Görüldü"}
      - {id: k_derece, etiket: Derece, seviye: 1, tip: secim, secenekler: [Düşük dereceli, Yüksek dereceli], kosul: "karsinom == Görüldü"}
      - {id: k_boyut, etiket: İnvaziv karsinom boyutu, seviye: 2, tip: olcu, birim: mm, kosul: "karsinom == Görüldü"}
      - {id: k_derinlik, etiket: Submukozal invazyon derinliği, seviye: 1, tip: metin, kalip: "… µm (muskularis mukozadan)", kosul: "karsinom == Görüldü"}
      - {id: k_haggitt, etiket: Haggitt düzeyi (saplı polip), seviye: 2, tip: secim, secenekler: ["Düzey 1", "Düzey 2", "Düzey 3", "Düzey 4"], kosul: "saplı"}
      - {id: k_kikuchi, etiket: "Kikuchi düzeyi (sesil, muskularis propria varsa)", seviye: 3, tip: secim, secenekler: [sm1, sm2, sm3], kosul: "sesil"}
      - {id: k_lvi, etiket: Lenfovasküler invazyon, seviye: 1, tip: secim, secenekler: [Görülmedi, Görüldü, Belirlenemedi], kosul: "karsinom == Görüldü"}
      - {id: k_budding, etiket: Tümör tomurcuklanması (ITBCC), seviye: 1, tip: secim, secenekler: ["Bd1 (0–4)", "Bd2 (5–9)", "Bd3 (≥10)"], kosul: "karsinom == Görüldü"}
      - {id: k_sinir, etiket: Derin (vertikal) sınır, seviye: 1, tip: secim, secenekler: ["Tümör görülmedi; mesafe … mm", "Tümör ≤1 mm (pozitif)", "Değerlendirilemedi"], kosul: "karsinom == Görüldü"}
      - {id: k_yan_sinir, etiket: Yan (mukozal) sınır, seviye: 2, tip: secim, secenekler: [Adenom / karsinom görülmedi, Adenom var, Karsinom var], kosul: "karsinom == Görüldü"}
      - {id: k_risk, etiket: Risk değerlendirmesi, seviye: 1, tip: secim, secenekler: ["Düşük risk özellikleri (düşük derece, LVI yok, Bd1, sınır >1 mm)", "Yüksek risk özellik(ler)i mevcut: …"], kosul: "karsinom == Görüldü"}
  - {id: mmr, etiket: MMR (İHK), seviye: 3, tip: metin, kosul: "karsinom == Görüldü"}
makroskopi:
  alanlar:
    - {id: kod, etiket: Kap kodu, zorunlu: true}
    - {id: yer, etiket: Kayıtlı yer, zorunlu: true}
    - {id: boyut, etiket: Polip / parça boyutu, tip: olcu, birim: cm, zorunlu: true}
    - {id: sap, etiket: Sap, tip: secim, secenekler: ["… cm uzunluğunda sapı mevcuttur", sapsızdır]}
    - {id: yuzey, etiket: Yüzey, tip: secim, secenekler: [lobüle, düzgün, ülsere]}
    - {id: parca_durumu, etiket: Bütünlük, tip: secim, secenekler: [bütün halinde, parçalı halde]}
    - {id: parca, etiket: Parça, tip: sayi}
    - {id: kaset, etiket: Kaset, tip: sayi}
  varyantlar:
    - ad: Polipektomi / EMR / ESD
      tekrar:
        etiket: Her kap için
        metin: "{kod} ({yer} kayıtlı materyal): {parca_durumu} gönderilen, {boyut} cm boyutlarında, {yuzey} yüzeyli polipoid doku; {sap}. Koterize taban boyandı. Tümü {parca} parça {kaset} kasette takibe alındı."
  yapilacaklar:
    - Koterize taban/kenar boyanır (kurumadan önce).
    - Saplı polipte sap uzun eksen boyunca ortadan ikiye (sap tam kesitte olacak şekilde); >1 cm'lik sesil polipte taban dik kesitlerle.
    - ESD materyali iğnelenerek gerilir, 2 mm aralıklarla dilimlenir, haritalanır.
    - Polip tamamı takibe alınır.
