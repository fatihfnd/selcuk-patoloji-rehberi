id: meme-igne-biyopsi
baslik: Meme — invaziv karsinom, iğne (tru-cut) biyopsi
organ: Meme
materyal: Biyopsi
kaynaklar:
  - "CAP — Breast Biomarker Reporting Template"
  - "ICCR — Invasive Carcinoma of the Breast (biopsy bölümü)"
  - "WHO Meme Tümörleri, 5. baskı (2019)"
  - "ASCO/CAP ER/PR ve HER2 kılavuzları"
tani:
  - "{histolojik_tip}, lütfen epikrizi okuyunuz; {lateralite} meme saat … hizası, tru-cut biyopsi"
epikriz:
  - id: histolojik_tip
    etiket: Histolojik tip
    seviye: 1
    tip: secim
    serbest: true
    secenekler: &meme_tip
      - "İnvaziv karsinom, özel tip olmayan (NST)"
      - "İnvaziv lobüler karsinom"
      - "Tübüler karsinom"
      - "Kribriform karsinom"
      - "Müsinöz karsinom"
      - "İnvaziv mikropapiller karsinom"
      - "Metaplastik karsinom"
      - "Apokrin diferansiasyonlu karsinom"
      - "İnvaziv karsinom NST, medüller paternli"
      - "Adenoid kistik karsinom"
      - "Sekretuar karsinom"
      - "Nöroendokrin tümör / nöroendokrin karsinom"
  - id: lateralite
    etiket: Taraf
    seviye: 0
    tip: secim
    secenekler: [Sağ, Sol]
    gizli: true
  - id: derece
    etiket: Histolojik derece (Nottingham)
    seviye: 1
    tip: secim
    secenekler: ["1", "2", "3"]
    alt:
      - {id: tubul, etiket: Tübül/bez formasyonu, seviye: 1, tip: secim, secenekler: [Skor 1, Skor 2, Skor 3]}
      - {id: pleomorfizm, etiket: Nükleer pleomorfizm, seviye: 1, tip: secim, secenekler: [Skor 1, Skor 2, Skor 3]}
      - {id: mitoz, etiket: Mitoz, seviye: 1, tip: secim, secenekler: [Skor 1 (… /… mm²), Skor 2 (… /… mm²), Skor 3 (… /… mm²)]}
  - id: dcis
    etiket: Duktal karsinoma in situ
    seviye: 1
    tip: secim
    secenekler: [Görülmedi, "Görüldü (nükleer derece …, …patern)"]
  - {modul: ortak.nekroz, seviye: 3}
  - modul: ortak.lvi
  - id: mikrokalsifikasyon
    etiket: Mikrokalsifikasyon
    seviye: 2
    tip: secim
    secenekler: [Görülmedi, İnvaziv karsinomda görüldü, DCIS'te görüldü, Benign parankimde görüldü]
  - id: bb_baslik
    etiket: Biyobelirteçler
    seviye: 1
    alt:
      - modul: biyobelirtec.meme_er
      - modul: biyobelirtec.meme_pr
      - modul: biyobelirtec.meme_her2
      - modul: biyobelirtec.meme_her2_ish
      - modul: biyobelirtec.meme_ki67
      - modul: biyobelirtec.meme_ekaderin
      - modul: biyobelirtec.meme_miyoepitel
  - id: til
    etiket: Stromal tümör infiltre eden lenfositler (sTIL)
    seviye: 3
    tip: olcu
    birim: "%"
    not: "Özellikle TNBC ve HER2+ olgularda; Uluslararası TIL Çalışma Grubu yöntemi."
makroskopi:
  alanlar:
    - {id: taraf, etiket: Taraf, tip: secim, secenekler: [Sağ, Sol], zorunlu: true}
    - {id: saat, etiket: Saat hizası / kadran, zorunlu: true}
    - {id: adet, etiket: Parça sayısı, tip: sayi, zorunlu: true}
    - {id: en_buyuk, etiket: En büyük parça uzunluğu, tip: olcu, birim: cm, zorunlu: true}
    - {id: en_kucuk, etiket: En küçük parça uzunluğu, tip: olcu, birim: cm}
    - {id: renk, etiket: Renk, tip: secim, secenekler: [krem, krem-sarı, sarı, beyaz], zorunlu: false}
    - {id: iskemi, etiket: Soğuk iskemi süresi, tip: sayi, birim: dk, zorunlu: true, not: "ASCO/CAP: ≤1 saat hedeflenir; biyobelirteç geçerliliği için."}
    - {id: fiksasyon, etiket: Formalin fiksasyon süresi, tip: sayi, birim: saat, zorunlu: true, not: "ASCO/CAP: 6–72 saat."}
  varyantlar:
    - ad: Tru-cut biyopsi
      metin:
        - >-
          {taraf} meme saat {saat} hizası kayıtlı materyal: En büyüğü {en_buyuk} cm, en küçüğü {en_kucuk} cm
          uzunluğunda, {renk} renkte, {adet} adet tru-cut biyopsi materyali. Soğuk iskemi süresi {iskemi} dakika,
          fiksasyon süresi {fiksasyon} saattir.
      ornekleme:
        - {kod: T, aciklama: "tümü", tek: true}
  yapilacaklar:
    - Parçalar dilimlenmeden, düz ve paralel yerleştirilir; ≤3–4 kor / kaset.
    - Kalsifikasyon için gönderildiyse kalsifik ve nonkalsifik korlar ayrı kasetlenir (radyografi notu).
    - Soğuk iskemi ve fiksasyon süreleri kayda geçirilir.
