id: serviks-radikal
baslik: Serviks karsinomu — radikal histerektomi / trakelektomi
organ: Serviks
materyal: Rezeksiyon
kaynaklar:
  - "CAP — Uterine Cervix (Excision / Hysterectomy)"
  - "ICCR — Carcinoma of the Cervix"
  - "WHO Kadın Genital Tümörleri, 5. baskı (2020) — HPV ilişkili / bağımsız ayrımı"
  - "FIGO 2018 serviks kanseri evrelemesi; AJCC 8"
not: "Önceki konizasyon / LEEP bulguları (derinlik, boyut) nihai evre için birleştirilir — önceki rapor numarası yazılmalı."
tani:
  - "{histolojik_tip}, lütfen epikrizi okuyunuz; serviks uteri, {prosedur}"
  - "- Metastatik lenf nodları (… adet), nonmetastatik lenf nodları (… adet); pelvik / sentinel / paraaortik"
epikriz:
  - {id: prosedur, etiket: Prosedür, seviye: 1, tip: secim, serbest: true, secenekler: [radikal histerektomi, "radikal histerektomi + bilateral salpingo-ooferektomi", radikal trakelektomi, basit histerektomi]}
  - {id: onceki, etiket: Önceki eksizyon, seviye: 1, tip: metin, kalip: "Yok / … no'lu konizasyon: … mm derinlik, … mm yayılım"}
  - {id: neoadjuvan, etiket: Neoadjuvan tedavi, seviye: 1, tip: secim, secenekler: [Yok, Var, Bilinmiyor], gizli: true}
  - {id: histolojik_tip, etiket: Histolojik tip, seviye: 1, tip: secim, serbest: true, secenekler: ["Skuamöz hücreli karsinom, HPV ilişkili", "Skuamöz hücreli karsinom, HPV bağımsız", "Adenokarsinom, HPV ilişkili (olağan tip / müsinöz / …)", "Adenokarsinom, HPV bağımsız, gastrik tip", "Adenokarsinom, HPV bağımsız, berrak hücreli", "Adenokarsinom, HPV bağımsız, mezonefrik", Adenoskuamöz karsinom, "Nöroendokrin karsinom"]}
  - {id: hpv, etiket: HPV durumu, seviye: 1, tip: secim, secenekler: ["p16 blok tipi pozitif", "p16 negatif", "HPV ISH / PCR: …"]}
  - {id: derece, etiket: Histolojik derece, seviye: 3, tip: secim, secenekler: [İyi diferansiye, Orta derecede diferansiye, Az diferansiye, Uygulanmaz]}
  - {id: silva, etiket: Silva paterni, seviye: 2, tip: secim, secenekler: [Patern A, Patern B, Patern C], kosul: "HPV ilişkili adenokarsinom"}
  - {id: boyut, etiket: Tümör boyutu (3 boyut), seviye: 1, tip: metin, kalip: "Yatay … mm × … mm; derinlik … mm (en büyük boyut … mm)", not: "FIGO 2018: IB1 ≤2 cm, IB2 >2–≤4 cm, IB3 >4 cm."}
  - {id: stroma, etiket: Stromal invazyon derinliği / servikal duvar kalınlığı, seviye: 1, tip: metin, kalip: "… mm / … mm (%…); iç / orta / dış üçlü"}
  - modul: ortak.lvi
  - {id: yayilim, etiket: Tümör yayılımı, seviye: 1, tip: coklu, secenekler: [Servikse sınırlı, "Alt uterin segment / korpus", "Vajen üst 2/3 (IIA)", "Vajen alt 1/3 (IIIA)", "Parametrium (IIB)", "Mesane / rektum mukozası (IVA)"]}
  - {id: parametrium, etiket: Parametrium, seviye: 1, tip: secim, secenekler: ["Tutulum görülmedi", "Doğrudan invazyon", "Yalnız LVSI / lenf nodu şeklinde tutulum"]}
  - {id: tedavi_etkisi, etiket: Tedavi yanıtı, seviye: 1, kosul: "neoadjuvan == Var", tip: secim, secenekler: ["Rezidü tümör görülmedi", "Rezidü tümör (… mm, belirgin regresyon)", "Belirgin yanıt yok"]}
  - id: sinir
    etiket: Cerrahi sınırlar
    seviye: 1
    alt:
      - {id: s_vajen, etiket: Vajinal kaf, seviye: 1, tip: secim, secenekler: ["İnvaziv karsinom / HSIL görülmedi (… mm)", "HSIL görüldü", "İnvaziv karsinom görüldü"]}
      - {id: s_param, etiket: Parametrial, seviye: 1, tip: secim, secenekler: ["Tümör görülmedi (… mm)", "Tümör görüldü"]}
      - {id: s_derin, etiket: "Derin (radyal) stromal / endoservikal (trakelektomide)", seviye: 1, tip: secim, secenekler: ["Tümör görülmedi (… mm)", "Tümör görüldü"]}
  - id: lenf_nodu
    etiket: Lenf nodları
    seviye: 1
    tip: metin
    kalip: "Sentinel …, pelvik … (sağ …, sol …), paraaortik … lenf nodu incelendi; …'inde metastaz görüldü / metastaz görülmedi"
    alt:
      - {id: ln_boyut, etiket: Metastaz boyutu, seviye: 1, tip: secim, secenekler: ["Makrometastaz (>2 mm)", "Mikrometastaz (>0,2–2 mm)", "İzole tümör hücreleri (≤0,2 mm; FIGO'da N0(i+))"]}
      - {id: ene, etiket: Ekstranodal yayılım, seviye: 3, tip: secim, secenekler: [Görülmedi, Görüldü]}
  - {id: figo, etiket: FIGO 2018 evresi (patolojik), seviye: 1, tip: secim, serbest: true, secenekler: ["IA1", "IA2", "IB1", "IB2", "IB3", "IIA1", "IIA2", "IIB", "IIIA", "IIIC1p", "IIIC2p", "IVA"]}
  - modul: ortak.ptnm
  - {id: diger, etiket: Diğer bulgular, seviye: 3, tip: coklu, secenekler: [HSIL (tümör dışı), Adenokarsinoma in situ, "Endometrium: … fazı", Leiyomyom, "…"]}
makroskopi:
  alanlar:
    - {id: fiksasyon_durumu, etiket: Geliş durumu, tip: secim, secenekler: [Formalin içinde, Taze], zorunlu: true}
    - {id: prosedur, etiket: Prosedür, zorunlu: true}
    - {id: agirlik, etiket: Ağırlık, tip: sayi, birim: g}
    - {id: uterus_boyut, etiket: Uterus boyutu, tip: olcu, birim: cm, zorunlu: true}
    - {id: vajen_kaf, etiket: Vajinal kaf, tip: metin, zorunlu: true, not: "Anterior … cm, posterior … cm, sağ … cm, sol … cm uzunluğunda"}
    - {id: param, etiket: Parametriumlar, tip: metin, zorunlu: true, not: "Sağ …x… cm, sol …x… cm"}
    - {id: tumor_yer, etiket: Tümör yerleşimi (saat / dudak), zorunlu: true}
    - {id: tumor_boyut, etiket: Tümör boyutu, tip: olcu, birim: cm, zorunlu: true}
    - {id: gorunum, etiket: Görünüm, tip: secim, secenekler: [ekzofitik, "ülsere-infiltratif", "fıçı şeklinde (barrel) endofitik", "makroskopik tümör izlenmedi (konizasyon sonrası)"]}
    - {id: mesafeler, etiket: Sınırlara uzaklıklar, zorunlu: true, not: "Vajinal sınıra … cm, sağ parametriuma … cm, sol parametriuma … cm; stromal derinlik … cm / duvar … cm"}
    - {id: korpus, etiket: Korpus / endometrium, tip: metin}
    - {id: adneks, etiket: Adneksler, tip: metin}
  varyantlar:
    - ad: Radikal histerektomi
      metin:
        - >-
          {fiksasyon_durumu} gönderilen, {agirlik} g ağırlığında, {uterus_boyut} cm boyutlarında {prosedur} materyalidir.
          Vajinal kaf {vajen_kaf}; parametriumlar {param} boyutlarındadır. Parametriumlar ve vajinal kaf boyandı.
        - >-
          Serviks {tumor_yer} yerleşimli, {tumor_boyut} cm boyutlarında, {gorunum} tümör izlendi. {mesafeler}.
        - "Korpus / endometrium: {korpus}. Adneksler: {adneks}."
      ornekleme:
        - {kod: "S1–S12", aciklama: "serviks saat dilimleri, ALU dahil tam kat", not: "Tümör küçükse / konizasyon sonrasında serviks tamamen; büyük tümörde her kadrandan tam kat + en derin invazyon."}
        - {kod: VK, aciklama: "vajinal kaf sınırı (en face / dik)", parca: "…", kaset: "…"}
        - {kod: PS, aciklama: "sağ parametrium, tamamı", parca: "…", kaset: "…"}
        - {kod: PL, aciklama: "sol parametrium, tamamı", parca: "…", kaset: "…"}
        - {kod: ALU, aciklama: alt uterin segment, parca: "…", kaset: "…"}
        - {kod: E, aciklama: endometrium-miyometrium, parca: "1", kaset: "1"}
        - {kod: STO, aciklama: sağ adneks, parca: "…", kaset: "…"}
        - {kod: LTO, aciklama: sol adneks, parca: "…", kaset: "…"}
  ek_materyaller: [makro.sentinel, makro.ln_istasyon]
  yapilacaklar:
    - Parametriumları uterustan ayırmadan ölç ve boya; ardından tamamen örnekle (içindeki lenf nodları dahil).
    - Vajinal kaf sınırını al; serviksi saat yönünde radyal dilimle, ALU'yu içerecek şekilde.
    - Tümör boyutunu üç eksende ve stromal derinliği duvar kalınlığıyla birlikte ölç.
    - Konizasyon sonrası materyalde rezidü alan tamamen örneklenir.
