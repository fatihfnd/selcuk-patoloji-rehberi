id: oral-kavite
baslik: Oral kavite ve dudak — skuamöz hücreli karsinom, rezeksiyon
organ: Oral kavite
materyal: Rezeksiyon
kaynaklar:
  - "CAP — Lip and Oral Cavity (Resection)"
  - "ICCR — Carcinomas of the Oral Cavity"
  - "RCPath — Dataset for mucosal malignancies of the oral cavity"
  - "WHO Baş ve Boyun Tümörleri, 5. baskı (2022); AJCC 8 (invazyon derinliği / DOI)"
not: "AJCC 8: DOI, komşu normal mukozanın bazal membran seviyesinden en derin invazyon noktasına dik ölçülür (tümör kalınlığı değildir)."
tani:
  - "{histolojik_tip}, lütfen epikrizi okuyunuz; {alt_bolge}, {prosedur}"
  - "- Metastatik lenf nodları (… adet), nonmetastatik lenf nodları (… adet); sağ / sol boyun diseksiyonu"
epikriz:
  - {id: prosedur, etiket: Prosedür, seviye: 1, tip: secim, serbest: true, secenekler: [geniş lokal eksizyon, parsiyel glossektomi, hemiglossektomi, "marjinal / segmental mandibulektomi", maksillektomi, "kompozit rezeksiyon"]}
  - {id: alt_bolge, etiket: Alt bölge, seviye: 0, gizli: true, tip: secim, secenekler: ["dil (ön 2/3)", ağız tabanı, bukkal mukoza, "alt / üst gingiva (alveolar sırt)", sert damak, retromolar trigon, "dudak (vermilyon)"]}
  - {id: boyut, etiket: Tümör boyutu, seviye: 1, tip: olcu, birim: cm, kalip: "…x… cm (en büyük boyut … cm)"}
  - {id: histolojik_tip, etiket: Histolojik tip, seviye: 1, tip: secim, serbest: true, secenekler: ["Skuamöz hücreli karsinom, konvansiyonel", "Bazaloid skuamöz hücreli karsinom", "Verrüköz karsinom", "Papiller skuamöz hücreli karsinom", "İğsi hücreli skuamöz hücreli karsinom", "Adenoskuamöz karsinom", "Akantolitik skuamöz hücreli karsinom"]}
  - {id: derece, etiket: Histolojik derece, seviye: 1, tip: secim, secenekler: [İyi diferansiye, Orta derecede diferansiye, Az diferansiye]}
  - {id: doi, etiket: İnvazyon derinliği (DOI), seviye: 1, tip: olcu, birim: mm, not: "≤5 mm / >5–10 mm / >10 mm eşikleri pT1–pT3'ü belirler."}
  - {id: kalinlik, etiket: Tümör kalınlığı, seviye: 3, tip: olcu, birim: mm}
  - {id: wpoi, etiket: En kötü invazyon paterni (WPOI), seviye: 2, tip: secim, secenekler: ["WPOI 1–3 (itici / büyük yuvalar)", "WPOI 4 (küçük adalar, <15 hücre)", "WPOI 5 (dağınık satellit, tümörden ≥1 mm uzakta)"]}
  - modul: ortak.lvi
  - {id: pni, etiket: Perinöral invazyon, seviye: 1, tip: secim, secenekler: [Görülmedi, "Görüldü (küçük sinirler)", "Görüldü (≥1 mm çaplı / isimli sinir)"]}
  - {id: kemik, etiket: Kemik invazyonu, seviye: 1, tip: secim, secenekler: [Görülmedi / örneklenmedi, "Yüzeyel kortikal erozyon (pT4a değildir)", "Medüller kemik invazyonu (pT4a)"]}
  - {id: yayilim, etiket: Diğer yayılım, seviye: 1, tip: coklu, secenekler: [Görülmedi, "Ekstrinsik dil kası (pT4a'yı değiştirmez — AJCC 8)", "Maksiller sinüs / yüz derisi (pT4a)", "Mastikatör boşluk / pterigoid plaklar / kafa tabanı / karotis (pT4b)"]}
  - id: sinir
    etiket: Cerrahi sınırlar
    seviye: 1
    not: "RCPath: >5 mm temiz, 1–5 mm yakın, <1 mm pozitif."
    alt:
      - {id: s_mukozal, etiket: Mukozal (periferik), seviye: 1, tip: secim, secenekler: ["İnvaziv karsinom görülmedi (en yakın … mm, … sınır)", "İnvaziv karsinom görüldü (… sınır)"]}
      - {id: s_displazi, etiket: Mukozal sınırda displazi, seviye: 1, tip: secim, secenekler: [Görülmedi, "Düşük dereceli displazi", "Yüksek dereceli displazi / karsinoma in situ"]}
      - {id: s_derin, etiket: Derin, seviye: 1, tip: secim, secenekler: ["Tümör görülmedi (… mm)", "Tümör görüldü"]}
      - {id: s_kemik, etiket: Kemik sınırları, seviye: 1, tip: secim, secenekler: [Uygulanmaz, "Tümör görülmedi", "Tümör görüldü (… sınır)"]}
  - modul: ortak.bb_lenf_nodu
  - modul: ortak.ptnm
  - {id: zemin, etiket: Tümör dışı mukoza, seviye: 3, tip: coklu, secenekler: [Özellik yok, Displazi, "Liken planus", "Submuköz fibrozis"]}
makroskopi:
  alanlar:
    - {id: fiksasyon_durumu, etiket: Geliş durumu, tip: secim, secenekler: [Formalin içinde, Taze], zorunlu: true}
    - {id: prosedur, etiket: Prosedür, zorunlu: true}
    - {id: isaret, etiket: Oryantasyon, tip: secim, secenekler: ["… ip ile … işaretlenmiş", işaretlenmemiş], zorunlu: true}
    - {id: boyut, etiket: Materyal boyutu, tip: olcu, birim: cm, zorunlu: true}
    - {id: kemik, etiket: Kemik bileşeni, tip: secim, secenekler: [içermemektedir, "… cm uzunluğunda mandibula / maksilla segmenti içermektedir"]}
    - {id: tumor_boyut, etiket: Tümör boyutu, tip: olcu, birim: cm, zorunlu: true}
    - {id: gorunum, etiket: Görünüm, tip: secim, secenekler: [ülsere, ekzofitik, "ülsere-infiltratif", "beyaz plak / verrüköz"]}
    - {id: doi_makro, etiket: Makroskopik derinlik, tip: olcu, birim: cm}
    - {id: mesafeler, etiket: Sınırlara uzaklıklar, zorunlu: true, not: "Anterior … cm, posterior … cm, medial … cm, lateral … cm, derin … cm, kemik sınırlarına … cm"}
  varyantlar:
    - ad: Oral kavite rezeksiyonu
      metin:
        - "{fiksasyon_durumu} {isaret} gönderilen, {boyut} cm boyutlarında {prosedur} materyalidir; {kemik}. Sınırlar farklı renklerde boyandı."
        - >-
          Mukoza yüzeyinde {tumor_boyut} cm boyutlarında, {gorunum} tümör izlendi; kesitlerde makroskopik derinliği {doi_makro} cm'dir.
          Tümör {mesafeler} mesafededir.
      ornekleme:
        - {kod: T, aciklama: "tümör, tam kat (en derin invazyon)", not: "DOI ölçümü için komşu normal mukozayı da içeren dik kesit."}
        - {kod: TS, aciklama: "tümör-en yakın mukozal / derin sınır, dik", parca: "…", kaset: "…"}
        - {kod: MS, aciklama: "diğer mukozal sınırlar (anterior, posterior, medial, lateral)", parca: "…", kaset: "…"}
        - {kod: DS, aciklama: derin sınır, parca: "…", kaset: "…"}
        - {kod: K, aciklama: "kemik: tümör-kemik ilişkisi ve kemik sınırları", parca: "…", kaset: "…", not: "Dekalsifikasyon; kemik sınırları ilik kazıntısı ile ayrıca."}
  ek_materyaller: [makro.ln_istasyon, makro.ek_cerrahi_sinir]
  yapilacaklar:
    - Oryantasyonu cerrahla netleştir; sınırları boya, fotoğrafla.
    - Tümörün tüm sınırlara uzaklığını tek cümlede ver.
    - DOI için tümörü komşu normal mukozayla birlikte dik kes.
    - Kemik içeriyorsa önce yumuşak doku sınırlarını al, sonra dekalsifiye et.
    - Frozen ile gönderilen ek sınırlar ayrı kodlanır ve nihai sınır olarak raporlanır.
