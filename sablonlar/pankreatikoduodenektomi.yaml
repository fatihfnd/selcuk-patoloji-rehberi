id: pankreatikoduodenektomi
baslik: Pankreatikoduodenektomi (Whipple) — pankreas başı karsinomu
organ: Pankreas
materyal: Rezeksiyon
kaynaklar:
  - "CAP — Pancreas (Exocrine) Resection"
  - "ICCR — Carcinoma of the Exocrine Pancreas"
  - "RCPath — Dataset for pancreas, ampulla and common bile duct"
  - "WHO Sindirim Sistemi Tümörleri, 5. baskı (2019); AJCC 8"
not: "Ampulla ve distal koledok kaynaklı karsinomlar kendi pT tanımlarıyla evrelenir; tümör merkezi belirlenmeden bu şablon kullanılmamalı."
tani:
  - "{histolojik_tip}, lütfen epikrizi okuyunuz; pankreas başı, pankreatikoduodenektomi"
  - "- Metastatik lenf nodları (… adet), nonmetastatik lenf nodları (… adet); peripankreatik yağ doku"
  - "Kronik kolesistit; safra kesesi, kolesistektomi"
epikriz:
  - {id: prosedur, etiket: Prosedür, seviye: 1, tip: secim, serbest: true, secenekler: [Pankreatikoduodenektomi (Whipple), Pilor koruyucu pankreatikoduodenektomi, "… + portal ven / SMV rezeksiyonu"]}
  - {id: neoadjuvan, etiket: Neoadjuvan tedavi, seviye: 1, tip: secim, secenekler: [Yok, Var, Bilinmiyor], gizli: true}
  - {id: merkez, etiket: Tümör merkezi, seviye: 1, tip: secim, secenekler: [Pankreas başı, Unsinat çıkıntı, Ampulla, Distal koledok, Duodenum]}
  - {id: boyut, etiket: Tümör boyutu, seviye: 1, tip: olcu, birim: cm, kalip: "…x…x… cm (en büyük boyut … cm)"}
  - {id: histolojik_tip, etiket: Histolojik tip, seviye: 1, tip: secim, serbest: true, secenekler: [Duktal adenokarsinom, "Duktal adenokarsinom, IPMN ile ilişkili", "Kolloid karsinom (IPMN ilişkili)", Adenoskuamöz karsinom, İndiferansiye karsinom, "Osteoklast benzeri dev hücreli indiferansiye karsinom", Asiner hücreli karsinom, "Solid psödopapiller neoplazm"]}
  - {id: derece, etiket: Histolojik derece, seviye: 1, tip: secim, secenekler: ["G1, iyi diferansiye", "G2, orta derecede diferansiye", "G3, az diferansiye"]}
  - {id: yayilim, etiket: Tümör yayılımı, seviye: 1, tip: coklu, secenekler: [Pankreasa sınırlı, Peripankreatik yağ doku, Duodenum duvarı, Ampulla, Koledok, "Portal ven / SMV duvarı", "Çölyak aks / SMA / ortak hepatik arter (pT4)"]}
  - modul: ortak.lvi
  - {modul: ortak.pni, seviye: 1}
  - id: tedavi_etkisi
    etiket: Tedavi yanıtı (CAP)
    seviye: 1
    kosul: "neoadjuvan == Var"
    tip: secim
    secenekler: ["Skor 0: canlı tümör hücresi yok", "Skor 1: tek hücre / küçük gruplar", "Skor 2: belirgin regresyonla rezidü tümör", "Skor 3: belirgin regresyon yok"]
  - id: sinir
    etiket: Cerrahi sınırlar (ve tümöre mesafe)
    seviye: 1
    not: "RCPath: ≤1 mm tümör varlığı R1 kabul edilir; CAP yalnızca mesafeyi ister."
    alt:
      - {id: s_boyun, etiket: Pankreas boyun (transeksiyon), seviye: 1, tip: secim, secenekler: ["Tümör görülmedi (… mm)", "İnvaziv karsinom görüldü", "Yüksek dereceli PanIN / IPMN görüldü"]}
      - {id: s_sma, etiket: SMA (unsinat / retroperitoneal) sınırı, seviye: 1, tip: secim, secenekler: ["Tümör görülmedi (… mm)", "Tümör görüldü"]}
      - {id: s_smv, etiket: SMV / portal ven oluğu, seviye: 1, tip: secim, secenekler: ["Tümör görülmedi (… mm)", "Tümör görüldü"]}
      - {id: s_posterior, etiket: Posterior yüz, seviye: 2, tip: secim, secenekler: ["Tümör görülmedi (… mm)", "Tümör görüldü"]}
      - {id: s_anterior, etiket: Anterior yüz (serbest yüzey), seviye: 2, tip: secim, secenekler: ["Tümör görülmedi (… mm)", "Tümör görüldü"]}
      - {id: s_koledok, etiket: Koledok (hepatik kanal) sınırı, seviye: 1, tip: secim, secenekler: ["Tümör görülmedi", "İnvaziv karsinom / displazi görüldü"]}
      - {id: s_mide, etiket: Proksimal (mide / duodenum) sınırı, seviye: 1, tip: secim, secenekler: ["Tümör görülmedi", "Tümör görüldü"]}
      - {id: s_jejunum, etiket: Distal (duodenum / jejunum) sınırı, seviye: 1, tip: secim, secenekler: ["Tümör görülmedi", "Tümör görüldü"]}
  - id: lenf_nodu
    etiket: Lenf nodları
    seviye: 1
    tip: metin
    kalip: "… lenf nodu incelendi; …'inde metastaz görüldü / metastaz görülmedi"
    not: "En az 12 (tercihen ≥15) lenf nodu önerilir; pN1: 1–3, pN2: ≥4 metastatik nod."
  - modul: ortak.ptnm
  - {id: oncul, etiket: Öncül lezyon, seviye: 2, tip: secim, secenekler: [Görülmedi, "Düşük dereceli PanIN", "Yüksek dereceli PanIN", "IPMN (…, düşük / yüksek dereceli displazi)"]}
  - {id: arka_plan, etiket: Tümör dışı pankreas, seviye: 2, tip: coklu, secenekler: [Kronik pankreatit, Atrofi, Obstrüktif değişiklik, Özellik yok]}
  - id: bb_baslik
    etiket: Biyobelirteçler
    seviye: 3
    alt:
      - {modul: biyobelirtec.mmr, seviye: 3}
makroskopi:
  alanlar:
    - {id: fiksasyon_durumu, etiket: Geliş durumu, tip: secim, secenekler: [Formalin içinde, Taze], zorunlu: true}
    - {id: parcalar, etiket: Materyali oluşturan organlar, zorunlu: true, not: "Ör. KK boyunca … cm mide antrumu, … cm duodenum, …x…x… cm pankreas başı, … cm koledok, …x… cm safra kesesi"}
    - {id: boya, etiket: Boyama şeması, zorunlu: true, not: "Ör. SMA sınırı yeşil, SMV oluğu mavi, posterior siyah, anterior sarı, boyun kırmızı"}
    - {id: kesim, etiket: Kesim yöntemi, tip: secim, secenekler: ["pankreas başı aksiyel düzlemde 3–5 mm aralıklarla dilimlendi", "koledok ve Wirsung kanalı boyunca bivalve edildi"], zorunlu: true}
    - {id: merkez, etiket: Tümör merkezi, zorunlu: true}
    - {id: tumor_boyut, etiket: Tümör boyutu, tip: olcu, birim: cm, zorunlu: true}
    - {id: tumor_gorunum, etiket: Görünüm, tip: secim, secenekler: ["gri-beyaz, sert, sınırları belirsiz", "kistik-solid", "müsinöz kistik"]}
    - {id: yayilim, etiket: Makroskopik yayılım, tip: secim, secenekler: [pankreasa sınırlı, "duodenum duvarına uzanan", "koledoğa / ampullaya uzanan", "peripankreatik yağ dokuya uzanan"]}
    - {id: mesafeler, etiket: Sınırlara uzaklıklar, zorunlu: true, not: "SMA … cm, SMV oluğu … cm, posterior … cm, anterior … cm, boyun … cm"}
    - {id: kanallar, etiket: Koledok / Wirsung çapı, not: "Koledok … cm, Wirsung … cm çapında"}
    - {id: ln_max, etiket: En büyük lenf nodu, tip: olcu, birim: cm}
    - {id: ln_min, etiket: En küçük lenf nodu, tip: olcu, birim: cm}
    - {id: ln_adet, etiket: Lenf nodu sayısı, tip: sayi, zorunlu: true}
  varyantlar:
    - ad: Pankreatikoduodenektomi
      metin:
        - "{fiksasyon_durumu} gönderilen pankreatikoduodenektomi materyalidir; {parcalar} içermektedir."
        - "Cerrahi sınırlar boyandı ({boya}); {kesim}. Koledok ve Wirsung kanalı: {kanallar}."
        - >-
          Kesitlerde tümör merkezi {merkez} olan, {tumor_boyut} cm boyutlarında, {tumor_gorunum} tümör izlendi;
          tümör makroskopik olarak {yayilim}. Tümörün cerrahi sınırlara uzaklıkları: {mesafeler}.
        - >-
          Peripankreatik yağ dokuda en büyüğü {ln_max} cm, en küçüğü {ln_min} cm çapında {ln_adet} adet lenf nodu
          diseke edildi.
      ornekleme:
        - {kod: PB, aciklama: pankreas boyun sınırı, parca: "1", kaset: "1", not: "En face."}
        - {kod: KS, aciklama: koledok sınırı, parca: "1", kaset: "1"}
        - {kod: MS, aciklama: mide / proksimal duodenum sınırı, parca: "1", kaset: "1"}
        - {kod: JS, aciklama: distal duodenum / jejunum sınırı, parca: "1", kaset: "1"}
        - {kod: T, aciklama: tümör, not: "Aksiyel dilimlerden; her dilimde tümör + en yakın boyalı yüz. En az 5 kaset."}
        - {kod: TSMA, aciklama: tümör-SMA sınırı, parca: "…", kaset: "…"}
        - {kod: TSMV, aciklama: tümör-SMV oluğu, parca: "…", kaset: "…"}
        - {kod: TP, aciklama: tümör-posterior yüz, parca: "…", kaset: "…"}
        - {kod: TA, aciklama: tümör-anterior yüz, parca: "…", kaset: "…"}
        - {kod: AMP, aciklama: ampulla ve tümör-duodenum-koledok ilişkisi, parca: "…", kaset: "…"}
        - {kod: P, aciklama: tümör dışı pankreas, parca: "1", kaset: "1"}
        - {kod: SK, aciklama: safra kesesi, parca: "…", kaset: "…"}
        - {kod: LN, aciklama: lenf nodları, not: "Tümü; peripankreatik, pilorik, hepatik arter bölgesi ayrı kodlanabilir."}
  ek_materyaller: [makro.ln_istasyon, makro.ek_cerrahi_sinir]
  yapilacaklar:
    - Oryante et; SMA, SMV oluğu, posterior, anterior ve boyun yüzlerini farklı renklerle boya.
    - Boyun, koledok, proksimal ve distal barsak sınırlarını dilimlemeden önce al.
    - Pankreas başını aksiyel düzlemde 3–5 mm aralıklarla dilimle, dilimleri sırayla fotoğrafla.
    - Tümör merkezi (pankreas / ampulla / koledok / duodenum) makroskopide açıkça belirtilir — evreleme bu karara bağlıdır.
    - Tüm dilimlerde en yakın boyalı yüze mesafeyi kaydet; ≥12–15 lenf nodu hedeflenir.
