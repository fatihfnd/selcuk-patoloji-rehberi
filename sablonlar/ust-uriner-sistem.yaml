id: ust-uriner-sistem
baslik: Üst üriner sistem — ürotelyal karsinom, nefroüreterektomi / segmental üreterektomi
organ: Renal pelvis / üreter
materyal: Rezeksiyon
kaynaklar:
  - "CAP — Ureter, Renal Pelvis (Resection)"
  - "ICCR — Carcinoma of the Renal Pelvis and Ureter"
  - "WHO 5. baskı (2022); AJCC 8"
not: "Üst üriner sistem ürotelyal karsinomu Lynch sendromu ile ilişkilidir; MMR değerlendirmesi önerilir."
tani:
  - "Ürotelyal karsinom, {derece_tani}, lütfen epikrizi okuyunuz; {taraf} {yerlesim}, {prosedur}"
  - "- Metastatik lenf nodları (… adet), nonmetastatik lenf nodları (… adet); hiler / paraaortik"
epikriz:
  - {id: prosedur, etiket: Prosedür, seviye: 1, tip: secim, serbest: true, secenekler: [radikal nefroüreterektomi (mesane kafı ile), segmental üreterektomi, üreteroskopik biyopsi]}
  - {id: taraf, etiket: Taraf, seviye: 0, gizli: true, tip: secim, secenekler: [sağ, sol]}
  - {id: derece_tani, etiket: Derece (tanı satırı), seviye: 0, gizli: true, tip: secim, secenekler: [düşük dereceli, yüksek dereceli]}
  - {id: yerlesim, etiket: Tümör yerleşimi, seviye: 1, tip: coklu, secenekler: [renal pelvis, kaliks, üst üreter, orta üreter, alt (distal) üreter, üreterovezikal bileşke]}
  - {id: boyut, etiket: Tümör boyutu, seviye: 2, tip: olcu, birim: cm}
  - modul: ortak.fokalite
  - {id: histolojik_tip, etiket: Histolojik tip, seviye: 1, tip: secim, serbest: true, secenekler: [Ürotelyal karsinom, "Ürotelyal karsinom, … alt tip / diferansiasyon (%…)", Skuamöz hücreli karsinom, Adenokarsinom]}
  - {id: derece, etiket: Histolojik derece, seviye: 1, tip: secim, secenekler: [Düşük dereceli, Yüksek dereceli]}
  - id: yayilim
    etiket: Tümör yayılımı
    seviye: 1
    tip: secim
    secenekler:
      - "Non-invaziv papiller (pTa)"
      - "Karsinoma in situ (pTis)"
      - "Subepitelyal bağ doku (pT1)"
      - "Muskularis propria (pT2)"
      - "Renal pelvis: peripelvik yağ doku veya renal parankim (pT3)"
      - "Üreter: periüreteral yağ doku (pT3)"
      - "Komşu organlar veya böbrek yoluyla perinefrik yağ doku (pT4)"
  - modul: ortak.lvi
  - {id: cis, etiket: Eşlik eden karsinoma in situ, seviye: 2, tip: secim, secenekler: [Görülmedi, Görüldü]}
  - id: sinir
    etiket: Cerrahi sınırlar
    seviye: 1
    alt:
      - {id: s_ureter, etiket: Üreter distal sınırı / mesane kafı, seviye: 1, tip: secim, secenekler: [Tümör / CIS görülmedi, CIS görüldü, İnvaziv karsinom görüldü]}
      - {id: s_yumusak, etiket: Hiler / periüreteral yumuşak doku, seviye: 1, tip: secim, secenekler: ["Tümör görülmedi (… mm)", "Tümör görüldü"]}
      - {id: s_ven, etiket: Renal ven, seviye: 2, tip: secim, secenekler: [Tümör görülmedi, Tümör görüldü]}
  - modul: ortak.lenf_nodu
  - modul: ortak.ptnm
  - {id: bobrek, etiket: Tümör dışı böbrek, seviye: 2, tip: coklu, secenekler: [Belirgin özellik yok, Hidronefroz / obstrüktif atrofi, Kronik piyelonefrit, Arterionefroskleroz, "…"]}
  - id: bb_baslik
    etiket: Biyobelirteçler
    seviye: 2
    alt:
      - {modul: biyobelirtec.mmr, seviye: 2}
makroskopi:
  alanlar:
    - {id: fiksasyon_durumu, etiket: Geliş durumu, tip: secim, secenekler: [Formalin içinde, Taze], zorunlu: true}
    - {id: taraf, etiket: Taraf, tip: secim, secenekler: [sağ, sol], zorunlu: true}
    - {id: prosedur, etiket: Prosedür, zorunlu: true}
    - {id: parcalar, etiket: Materyali oluşturan yapılar, zorunlu: true, not: "Ör. …x…x… cm böbrek, … cm uzunluğunda üreter, … cm çapında mesane kafı"}
    - {id: acma, etiket: Açılma şekli, tip: secim, secenekler: ["üreter longitudinal açılarak böbrek bivalve edildi"]}
    - {id: yerlesim, etiket: Tümör yerleşimi, zorunlu: true}
    - {id: tumor_boyut, etiket: Tümör boyutu, tip: olcu, birim: cm, zorunlu: true}
    - {id: gorunum, etiket: Görünüm, tip: secim, secenekler: [papiller, "solid-infiltratif", "düz, kırmızı alan"]}
    - {id: invazyon, etiket: Makroskopik invazyon, tip: secim, secenekler: [duvara sınırlı, "peripelvik / periüreteral yağ dokuya uzanan", renal parankime uzanan], zorunlu: true}
    - {id: d_sinir, etiket: En yakın sınıra uzaklık, tip: olcu, birim: cm, zorunlu: true}
    - {id: d_ureter, etiket: Distal üreter sınırına uzaklık, tip: olcu, birim: cm, zorunlu: true}
    - {id: bobrek, etiket: Tümör dışı böbrek, tip: secim, secenekler: [olağan görünümdedir, "pelvikaliseal sistem dilatedir; korteks incelmiştir"]}
  varyantlar:
    - ad: Nefroüreterektomi
      metin:
        - "{fiksasyon_durumu} gönderilen {taraf} {prosedur} materyalidir; {parcalar} içermektedir. Hiler ve periüreteral yumuşak doku boyandı; {acma}."
        - >-
          {yerlesim} yerleşimli, {tumor_boyut} cm boyutlarında, {gorunum} görünümde tümör izlendi. Kesitlerde tümör
          makroskopik olarak {invazyon}; en yakın cerrahi sınıra {d_sinir} cm, distal üreter sınırına {d_ureter} cm
          mesafededir. Tümör dışı böbrek {bobrek}.
      ornekleme:
        - {kod: T, aciklama: "tümör, tam kat", not: "En derin invazyon ve parankim / peripelvik yağ ilişkisi; en az 3 kaset."}
        - {kod: TP, aciklama: tümör-renal parankim / peripelvik yağ ilişkisi, parca: "…", kaset: "…"}
        - {kod: ÜS, aciklama: distal üreter sınırı / mesane kafı, parca: "…", kaset: "…"}
        - {kod: RV, aciklama: renal ven ve arter sınırı, parca: "1", kaset: "1"}
        - {kod: HY, aciklama: hiler yumuşak doku sınırı, parca: "…", kaset: "…"}
        - {kod: Ü, aciklama: "tümör dışı üreter (proksimal, orta, distal)", parca: "3", kaset: "…"}
        - {kod: B, aciklama: tümör dışı böbrek, parca: "1", kaset: "1"}
        - {kod: LN, aciklama: hiler lenf nodları, parca: "…", kaset: "…"}
  ek_materyaller: [makro.ln_istasyon]
  yapilacaklar:
    - Üreter distal sınırı / mesane kafını açmadan önce ayır.
    - Üreteri longitudinal aç, böbreği pelvis üzerinden bivalve et.
    - Pelvis tümörlerinde parankim ve renal sinüs yağı ile ilişki (pT3) mutlaka.
    - Multifokalite için tümör dışı üreter segmentlerinden örnek.
