id: distal-pankreatektomi
baslik: Distal pankreatektomi — pankreas tümörü (duktal adenokarsinom / PanNET / kistik neoplazm)
organ: Pankreas
materyal: Rezeksiyon
kaynaklar:
  - "CAP — Pancreas (Exocrine); Pancreas (Endocrine)"
  - "ICCR — Carcinoma of the Exocrine Pancreas; Pancreatic NET"
  - "WHO Sindirim Sistemi Tümörleri, 5. baskı (2019); AJCC 8"
tani:
  - "{histolojik_tip}, lütfen epikrizi okuyunuz; pankreas gövde / kuyruk, distal pankreatektomi"
  - "- Metastatik lenf nodları (… adet), nonmetastatik lenf nodları (… adet); peripankreatik yağ doku"
  - "Tümör içermeyen dalak; splenektomi"
epikriz:
  - {id: prosedur, etiket: Prosedür, seviye: 1, tip: secim, secenekler: [Distal pankreatektomi + splenektomi, Dalak koruyucu distal pankreatektomi, Santral pankreatektomi, "RAMPS"]}
  - {id: neoadjuvan, etiket: Neoadjuvan tedavi, seviye: 1, tip: secim, secenekler: [Yok, Var, Bilinmiyor], gizli: true}
  - {id: boyut, etiket: Tümör boyutu, seviye: 1, tip: olcu, birim: cm}
  - {id: histolojik_tip, etiket: Histolojik tip, seviye: 1, tip: secim, serbest: true, secenekler: [Duktal adenokarsinom, "İyi diferansiye nöroendokrin tümör, G…", Müsinöz kistik neoplazm, "IPMN (…)", Solid psödopapiller neoplazm, Seröz kistadenom, Asiner hücreli karsinom]}
  - {id: derece, etiket: Derece, seviye: 1, tip: secim, secenekler: ["G1", "G2", "G3", "Uygulanmaz"], not: "PanNET: Ki-67 <%3 / %3–20 / >%20; mitoz /2 mm²."}
  - {id: ki67, etiket: Ki-67 indeksi (PanNET), seviye: 1, tip: olcu, birim: "%", kosul: "PanNET"}
  - {id: kistik_derece, etiket: Kistik neoplazmda displazi derecesi, seviye: 1, tip: secim, secenekler: [Düşük dereceli, Yüksek dereceli, İnvaziv karsinom ile birlikte], kosul: "MKN / IPMN"}
  - {id: yayilim, etiket: Tümör yayılımı, seviye: 1, tip: coklu, secenekler: [Pankreasa sınırlı, Peripankreatik yağ doku, Dalak / splenik damarlar, "Çölyak eksen / SMA (pT4)", "Komşu organ (…)"]}
  - modul: ortak.lvi
  - {modul: ortak.pni, seviye: 1}
  - {id: tedavi_etkisi, etiket: Tedavi yanıtı (CAP), seviye: 1, kosul: "neoadjuvan == Var", tip: secim, secenekler: ["Skor 0", "Skor 1", "Skor 2", "Skor 3"]}
  - id: sinir
    etiket: Cerrahi sınırlar
    seviye: 1
    alt:
      - {id: s_transeksiyon, etiket: Pankreas transeksiyon sınırı, seviye: 1, tip: metin, kalip: "Tümör görülmedi (… mm) / görüldü; yüksek dereceli PanIN / IPMN: yok / var"}
      - {id: s_posterior, etiket: Posterior (retroperitoneal) sınır, seviye: 1, tip: metin, kalip: "Tümör görülmedi (… mm) / görüldü"}
      - {id: s_anterior, etiket: Anterior yüz, seviye: 3, tip: metin, kalip: "… mm"}
  - modul: ortak.lenf_nodu
  - modul: ortak.ptnm
  - {id: dalak, etiket: Dalak, seviye: 2, tip: secim, secenekler: [Tümör görülmedi, Doğrudan invazyon görüldü, Örneklenmedi]}
  - {id: arka_plan, etiket: Tümör dışı pankreas, seviye: 2, tip: coklu, secenekler: [Özellik yok, Kronik pankreatit, PanIN, Atrofi]}
makroskopi:
  alanlar:
    - {id: fiksasyon_durumu, etiket: Geliş durumu, tip: secim, secenekler: [Formalin içinde, Taze], zorunlu: true}
    - {id: pankreas_boyut, etiket: Pankreas boyutu, tip: olcu, birim: cm, zorunlu: true}
    - {id: dalak, etiket: Dalak, tip: secim, secenekler: ["…x…x… cm boyutlarında, … g ağırlığında dalak eşlik etmektedir", dalak eşlik etmemektedir]}
    - {id: tumor_boyut, etiket: Tümör boyutu, tip: olcu, birim: cm, zorunlu: true}
    - {id: kesit, etiket: Kesit yüzü, tip: secim, secenekler: ["gri-beyaz, sert, sınırları belirsiz", "kahverengi-kırmızı, sınırlı, yumuşak", "multiloküler kistik", "unilokuler kistik, müsinöz içerikli"], zorunlu: true}
    - {id: d_trans, etiket: Transeksiyon sınırına uzaklık, tip: olcu, birim: cm, zorunlu: true}
    - {id: d_post, etiket: Posterior sınıra uzaklık, tip: olcu, birim: cm, zorunlu: true}
    - {id: damar, etiket: Splenik damar ilişkisi, tip: secim, secenekler: [tümörle ilişkisizdir, "tümör tarafından çevrelenmiştir"]}
    - {id: ln_adet, etiket: Lenf nodu sayısı, tip: sayi, zorunlu: true}
    - {id: ln_max, etiket: En büyük lenf nodu, tip: olcu, birim: cm}
  varyantlar:
    - ad: Distal pankreatektomi
      metin:
        - >-
          {fiksasyon_durumu} gönderilen, {pankreas_boyut} cm boyutlarında distal pankreatektomi materyalidir; {dalak}.
          Transeksiyon sınırı ve posterior yüz boyandı; pankreas uzun eksene dik 3–5 mm aralıklarla dilimlendi.
        - >-
          Kesitlerde {tumor_boyut} cm boyutlarında, {kesit} tümör izlendi. Tümör transeksiyon sınırına {d_trans} cm,
          posterior sınıra {d_post} cm mesafededir. Splenik damarlar {damar}.
        - "Peripankreatik yağ dokuda en büyüğü {ln_max} cm çapında {ln_adet} adet lenf nodu diseke edildi."
      ornekleme:
        - {kod: TCS, aciklama: "pankreas transeksiyon sınırı, en face", parca: "1", kaset: "1"}
        - {kod: T, aciklama: "tümör ve posterior sınır ilişkisi", not: "Kistik neoplazmda tamamı (invaziv komponent aranır)."}
        - {kod: V, aciklama: "splenik damarlar ve tümör ilişkisi", parca: "…", kaset: "…"}
        - {kod: P, aciklama: tümör dışı pankreas, parca: "1", kaset: "1"}
        - {kod: D, aciklama: "dalak ve hilus", parca: "…", kaset: "…"}
        - {kod: LN, aciklama: lenf nodları, not: "Tümü; splenik hilus nodları dahil."}
  ek_materyaller: [makro.ln_istasyon, makro.ek_cerrahi_sinir]
  yapilacaklar:
    - Transeksiyon sınırı en face alınır; posterior yüz boyanır.
    - Kistik neoplazmlarda kist tamamen örneklenir.
    - Dalak hilusu ve splenik damar-tümör ilişkisi örneklenir.
