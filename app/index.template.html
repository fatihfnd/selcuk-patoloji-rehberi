<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selçuk Patoloji Rehberi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --ink:#1B1F2E; --muted:#5B6173; --rule:#D6DAE3;
  --hema:#3D3B93; --hema-soft:#E7E6F6; --eosin:#C4466F; --eosin-soft:#F9E3EB; --focus:#3D3B93;
  --sans:"IBM Plex Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif:"IBM Plex Serif", Georgia, "Times New Roman", serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13151C; --surface:#1B1E27; --ink:#E6E8EF; --muted:#9CA2B3; --rule:#2E3240;
    --hema:#A9A7F3; --hema-soft:#262546; --eosin:#F18EAC; --eosin-soft:#3A2230; --focus:#A9A7F3;
  }
}
:root[data-theme="dark"]{
  --bg:#13151C; --surface:#1B1E27; --ink:#E6E8EF; --muted:#9CA2B3; --rule:#2E3240;
  --hema:#A9A7F3; --hema-soft:#262546; --eosin:#F18EAC; --eosin-soft:#3A2230; --focus:#A9A7F3;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:var(--hema)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{font-weight:600;font-size:17px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--eosin) 0 45%,var(--hema) 46%)}
.bar .sp{flex:1}
.theme{background:none;border:1px solid var(--rule);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--muted)}
main{max-width:1400px;margin:0 auto;padding:20px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;font-weight:600}
h2{font-size:18px;margin:28px 0 10px;font-weight:600}
h3{font-size:15px;margin:18px 0 6px;font-weight:600}
.muted{color:var(--muted)}
.tag{display:inline-block;font-family:var(--sans);font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.tag.N{background:var(--eosin-soft);border-color:transparent;color:var(--eosin)}
.tag.NN{background:var(--hema-soft);border-color:transparent;color:var(--hema)}
.tag.K{background:linear-gradient(90deg,var(--eosin-soft),var(--hema-soft));border-color:transparent;color:var(--ink)}
.btn{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn:hover{border-color:var(--hema)}
.btn.primary{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.btn.small{padding:2px 8px;font-size:12px}
/* home */
.home{display:grid;grid-template-columns:240px 1fr;gap:28px}
.side{position:sticky;top:76px;align-self:start}
.side h3{margin-top:0;color:var(--muted);font-weight:500;font-size:13px}
.side ul{list-style:none;padding:0;margin:0 0 18px}
.side li button{all:unset;cursor:pointer;display:flex;justify-content:space-between;width:100%;padding:5px 8px;border-radius:6px;font-size:14px}
.side li button:hover{background:var(--hema-soft)}
.side li button[aria-pressed="true"]{background:var(--hema);color:var(--surface)}
.side li button:focus-visible{outline:2px solid var(--focus)}
.search{width:100%;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);margin-bottom:18px}
.intro{max-width:70ch;color:var(--muted);margin:0 0 18px}
.sys{margin-bottom:26px}
.sys h2{margin:0 0 6px;padding-bottom:6px;border-bottom:2px solid var(--ink);font-size:16px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--rule)}
.row .t{font-weight:500}
.row .t small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.row .acts{display:flex;gap:6px}
.empty{padding:30px 0;color:var(--muted)}
/* template page */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--hema);color:var(--surface)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.form{min-width:0}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.panel>h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fld{padding:8px 0;border-top:1px solid var(--rule)}
.fld:first-of-type{border-top:0}
.fld .lbl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:500;font-size:14px;margin-bottom:4px}
.core{width:7px;height:7px;border-radius:50%;background:var(--eosin);display:inline-block;transform:translateY(-1px)}
.kosul{font-size:12px;color:var(--muted);font-weight:400}
.fld details{font-size:13px;color:var(--muted);margin-top:4px}
.fld details summary{cursor:pointer;width:max-content}
.kids{margin-left:14px;padding-left:12px;border-left:2px solid var(--hema-soft)}
.ctl{display:flex;flex-direction:column;gap:6px}
select,input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;font-size:14px}
textarea{resize:vertical;min-height:38px}
.unit{display:flex;gap:6px;align-items:center}
.unit input{max-width:220px}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px}
.checks label{display:flex;gap:5px;align-items:flex-start}
.alt label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px;border-top:1px dashed var(--rule)}
.alt label:first-child{border-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:5px 6px;text-align:left;vertical-align:top}
.tbl input[type=text]{padding:3px 6px}
.scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px dashed var(--rule);background:none;border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer;text-align:left;color:var(--muted)}
.chip:hover{border-color:var(--hema);color:var(--ink)}
.opts{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;align-items:center}
/* the report sheet */
.sheetwrap{position:sticky;top:76px}
.sheet{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--eosin);border-radius:4px 10px 10px 4px;padding:22px 24px;max-height:calc(100vh - 150px);overflow:auto}
.sheet pre{margin:0;white-space:pre-wrap;word-wrap:break-word;font:14.5px/1.65 var(--serif)}
.sheet .sec{font-weight:600}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.sheethead span{color:var(--muted);font-size:13px}
/* guide */
.guide{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px}
.toc{position:sticky;top:76px;align-self:start;font-size:14px}
.toc a{display:block;padding:3px 0;text-decoration:none;color:var(--muted)}
.toc a:hover{color:var(--hema)}
.read{max-width:78ch;font-family:var(--serif);font-size:16px;line-height:1.7}
.read h2{font-family:var(--sans);border-top:1px solid var(--rule);padding-top:18px}
.read h3{font-family:var(--sans)}
.read .fb{border-left:3px solid var(--hema-soft);padding:2px 0 2px 14px;margin:14px 0}
.read .fb.core{border-left-color:var(--eosin)}
.read .fb h4{font-family:var(--sans);font-size:15px;margin:0 0 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.read ul{margin:4px 0 8px;padding-left:20px}
.read .note{font-size:14.5px;color:var(--muted)}
.read pre{white-space:pre-wrap;font:14px/1.6 var(--serif);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.read .tbl{font-family:var(--sans)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--sans);font-size:13px;color:var(--muted)}
#print-area{display:none}
@media (max-width:980px){
  .work{grid-template-columns:1fr}
  .sheetwrap{position:static}
  .sheet{max-height:none}
  .home,.guide{grid-template-columns:1fr}
  .side,.toc{position:static}
  .row{grid-template-columns:1fr;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  .bar,main{display:none!important}
  #print-area{display:block!important;font:11pt/1.55 var(--serif);color:#000}
  #print-area pre{white-space:pre-wrap;font:inherit;margin:0}
  #print-area h1{font:600 14pt var(--sans);margin:0 0 4pt}
  #print-area .pm{font:9pt var(--sans);color:#444;margin-bottom:10pt}
  #print-area .guideprint{font-size:10.5pt}
}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="#/"><i aria-hidden="true"></i><span id="site-ad">Selçuk Patoloji Rehberi</span></a>
  <span class="sp"></span>
  <button class="theme" id="theme" type="button" aria-label="Renk temasını değiştir">Tema</button>
</div></header>
<main id="app"></main>
<div id="print-area"></div>
<script>const DATA = /*__DATA__*/null;</script>
<script>
(function(){
"use strict";
if (DATA.site){ document.title = DATA.site.ad; document.getElementById("site-ad").textContent = DATA.site.ad; }
const S = DATA.sablonlar, BY = {}, MOD = DATA.makro_moduller, SIN = DATA.siniflama;
S.forEach(s => BY[s.id] = s);
const GRUP = SIN.gruplar, GKISA = {N:"Neoplastik", NN:"Non-neoplastik", K:"Karma", S:"Sitoloji", E:"Ek test"}, SEVIYE = {1:"Kısa", 2:"Standart", 3:"Tam"}, SEV_AD = {0:"gizli",1:"çekirdek",2:"standart",3:"geniş"};
const app = document.getElementById("app");
const TOKEN = /\{(\w+)\}/g;
const states = {};
const home = {sistem:null, grup:null, q:""};

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){ if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
function cap(x){ return x ? x.charAt(0).toLocaleUpperCase("tr") + x.slice(1) : x; }
function visible(a, lvl){ return !a.gizli && a.seviye !== 0 && a.seviye <= lvl; }
function degerMetni(a){
  if (a.kalip) return a.kalip;
  const t = a.tip;
  if (t === "secim" || t === "coklu"){
    const s = a.secenekler || [], j = s.join(" / ");
    const kisa = s.every(x => x.length <= 4) && s.length <= 10;
    return (kisa || (s.length <= 6 && j.length <= 140)) ? j : "…";
  }
  if (t === "olcu") return a.birim === "%" ? "%…" : ("… " + (a.birim || "")).trim();
  return t ? "…" : "";
}
function withUnit(a, v){
  if (!v || !a.birim) return v;
  if (!/^[\d\s.,x×\-–]+$/.test(v)) return v;
  return a.birim === "%" ? "%" + v.trim() : v.trim() + " " + a.birim;
}
function allFields(list, out){ out = out || []; (list || []).forEach(a => { out.push(a); allFields(a.alt, out); }); return out; }
function copyText(t, btn){
  const done = () => { if (btn){ const o = btn.textContent; btn.textContent = "Kopyalandı"; setTimeout(() => btn.textContent = o, 1400); } };
  const fb = () => { const ta = h("textarea"); ta.value = t; document.body.append(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} ta.remove(); done(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fb); else fb();
}
function printDoc(title, meta, body, isGuide){
  const pa = document.getElementById("print-area");
  pa.innerHTML = "";
  pa.append(h("h1", null, title), h("div", {class:"pm"}, meta));
  if (isGuide) pa.append(h("div", {class:"guideprint"}, body)); else pa.append(h("pre", null, body));
  window.print();
}

/* ---------- theme ---------- */
(function(){
  const btn = document.getElementById("theme");
  let t = null; try { t = localStorage.getItem("spr-tema"); } catch(e){}
  if (t) document.documentElement.setAttribute("data-theme", t);
  btn.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nx = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nx);
    try { localStorage.setItem("spr-tema", nx); } catch(e){}
  });
})();

/* ---------- home ---------- */
function renderHome(){
  app.innerHTML = "";
  const counts = {}; S.forEach(s => { const k = s._sistem; counts[k] = (counts[k]||0) + 1; });
  const gcounts = {}; S.forEach(s => { gcounts[s._grup] = (gcounts[s._grup]||0) + 1; });
  const list = h("div");
  const side = h("aside", {class:"side"},
    h("input", {class:"search", type:"search", placeholder:"Şablon ara (ör. tiroid, Bethesda, nefrektomi)", "aria-label":"Şablon ara", value:home.q,
      oninput:e => { home.q = e.target.value; draw(); }}),
    h("h3", null, "Kategori"),
    h("ul", null, h("li", null, btnF("Tümü", S.length, home.grup === null, () => { home.grup = null; redraw(); })),
      Object.keys(GRUP).map(g => h("li", null, btnF(GRUP[g], gcounts[g]||0, home.grup === g, () => { home.grup = g; redraw(); })))),
    h("h3", null, "Organ sistemi"),
    h("ul", null, h("li", null, btnF("Tüm sistemler", S.length, home.sistem === null, () => { home.sistem = null; redraw(); })),
      SIN.sistemler.map(x => h("li", null, btnF(x, counts[x]||0, home.sistem === x, () => { home.sistem = x; redraw(); }))))
  );
  function btnF(label, n, on, fn){ return h("button", {type:"button", "aria-pressed": on ? "true" : "false", onclick:fn}, h("span", null, label), h("span", null, String(n))); }
  function redraw(){ renderHome(); }
  function draw(){
    list.innerHTML = "";
    const q = home.q.trim().toLocaleLowerCase("tr");
    const f = S.filter(s => (!home.grup || s._grup === home.grup) && (!home.sistem || s._sistem === home.sistem) &&
      (!q || (s.baslik + " " + s.organ + " " + s.id + " " + s._sistem + " " + (s.kaynaklar||[]).join(" ")).toLocaleLowerCase("tr").includes(q)));
    if (!f.length){ list.append(h("p", {class:"empty"}, "Bu filtrelerle eşleşen şablon yok. Aramayı kısaltmayı ya da kategoriyi “Tümü” yapmayı deneyin.")); return; }
    SIN.sistemler.forEach(sys => {
      const ss = f.filter(s => s._sistem === sys); if (!ss.length) return;
      list.append(h("section", {class:"sys"}, h("h2", null, sys),
        ss.map(s => h("div", {class:"row"},
          h("div", {class:"t"}, s.baslik, h("small", null, s.materyal + " · " + (s.kaynaklar||[])[0])),
          h("span", {class:"tag " + s._grup, title:GRUP[s._grup]}, GKISA[s._grup]),
          h("div", {class:"acts"}, h("a", {class:"btn small primary", href:"#/s/" + s.id}, "Şablon"), h("a", {class:"btn small", href:"#/r/" + s.id}, "Rehber"))
        ))));
    });
  }
  draw();
  app.append(h("div", {class:"home"}, side, h("div", null,
    h("h1", null, "Raporlama şablonları"),
    DATA.site ? h("p", {class:"muted", style:"margin:0 0 8px"}, DATA.site.alt_baslik) : null,
    h("p", {class:"intro"}, S.length + " şablon; CAP, ICCR, RCPath ve WHO kaynaklarına göre hazırlandı. Şablon sayfasında alanları doldurup raporu kopyalayabilir ya da boş şablonu basabilirsiniz; rehber sayfası her alanın seçeneklerini, notlarını ve makroskopi örnekleme kurallarını ayrıntılı gösterir."),
    list)));
  const si = side.querySelector(".search"); if (home.q){ si.focus(); si.setSelectionRange(home.q.length, home.q.length); }
}

/* ---------- template state ---------- */
function stateFor(s){
  if (states[s.id]) return states[s.id];
  const st = {lvl:2, vals:{}, showEmpty:false, tani:null, taniEdit:null, varyant:0, mvals:{}, rows:[{}], orn:null, kisa:false, ek:[], mikro:""};
  const lines = s.tani || [];
  if (s.tani_alternatif){ st.tani = {sec: lines.findIndex(l => !l.startsWith("-")), dash: lines.map(l => l.startsWith("-"))}; }
  else st.tani = {inc: lines.map(() => true)};
  states[s.id] = st; return st;
}
function ornFor(s, st){
  const v = s.makroskopi && s.makroskopi.varyantlar[st.varyant];
  if (!v) return [];
  if (!st.orn || st.orn.v !== st.varyant){
    st.orn = {v:st.varyant, rows:(v.ornekleme||[]).map(o => ({kod:o.kod, aciklama:o.aciklama, parca:o.parca||"", kaset:o.kaset||"", tek:!!o.tek, inc:true}))};
  }
  return st.orn.rows;
}

/* ---------- text builders ---------- */
function taniTokens(s, st, blank){
  const fs = {}; allFields(s.epikriz).forEach(a => fs[a.id] = a);
  return line => line.replace(TOKEN, (m, id) => {
    const a = fs[id], mv = st.mvals || {};
    const v = st.vals[id] || mv[id] || (id === "lateralite" ? mv.taraf : "") || (id === "taraf" ? mv.taraf : "");
    if (!blank && v) return v;
    if (a && a.secenekler && a.secenekler.length <= 3) return a.secenekler.map(x => x.toLocaleLowerCase("tr")).join(" / ");
    return "…";
  });
}
function taniText(s, st, blank){
  const lines = s.tani || [], f = taniTokens(s, st, blank), out = [];
  if (blank){
    let no = 0;
    lines.forEach(l => { if (l.startsWith("-")) out.push("   " + f(l)); else if (s.tani_alternatif) out.push("1- " + f(l)); else out.push((++no) + "- " + f(l)); });
    return out.join("\n");
  }
  if (st.taniEdit != null) return st.taniEdit;
  let no = 0;
  if (s.tani_alternatif){
    if (st.tani.sec >= 0) out.push("1- " + f(lines[st.tani.sec]));
    lines.forEach((l, i) => { if (l.startsWith("-") && st.tani.dash[i]) out.push("   " + f(l)); });
  } else {
    lines.forEach((l, i) => { if (!st.tani.inc[i]) return; if (l.startsWith("-")) out.push("   " + f(l)); else out.push((++no) + "- " + f(l)); });
  }
  return out.join("\n");
}
function hasValue(a, st){ return !!st.vals[a.id] || (a.alt || []).some(b => hasValue(b, st)); }
function epikrizLines(list, st, lvl, blank, depth, out){
  (list || []).forEach(a => {
    if (!visible(a, lvl)) return;
    const v = blank ? degerMetni(a) : withUnit(a, st.vals[a.id] || "");
    if (!blank && !st.showEmpty && !hasValue(a, st)) return;
    const shown = blank ? v : (v || (st.showEmpty && a.tip ? degerMetni(a) : ""));
    out.push("   ".repeat(depth) + "- " + a.etiket + ":" + (shown ? " " + shown : ""));
    epikrizLines(a.alt, st, lvl, blank, depth + 1, out);
  });
  return out;
}
function epikrizText(s, st, blank){
  const out = [];
  if (s.tekrar_blok){
    const tb = s.tekrar_blok;
    if (blank){ out.push("- " + tb.etiket.replace("{kor_kodu}", "… (kod)") + ":  [" + tb.aciklama + "]"); epikrizLines(tb.alanlar, st, st.lvl, true, 1, out); }
    else (st.tekrar || []).forEach(r => {
      const sub = {vals:r.vals, showEmpty:st.showEmpty};

      zor.length ? [h("h3", null, "Zorunlu veriler"), h("ul", null, zor.map(a => h("li", null, a.etiket + (a.birim ? " (" + a.birim + ")" : "") + (a.not ? " — " + a.not : ""))))] : null,
      m.varyantlar.map(v => [h("h3", null, v.ad),
        h("pre", null, [(v.metin || []).map(t => cap(makroToken(m.alanlar, null, true)(t))).join("\n"), v.tekrar ? cap(makroToken(m.alanlar, null, true)(v.tekrar.metin)) + "   [" + v.tekrar.etiket + "]" : ""].filter(Boolean).join("\n")),
        (v.ornekleme || []).length ? h("div", {class:"scroll"}, h("table", {class:"tbl"},
          h("thead", null, h("tr", null, h("th", null, "Kod"), h("th", null, "Açıklama"), h("th", null, "Varsayılan"), h("th", null, "Örnekleme kuralı"))),
          h("tbody", null, v.ornekleme.map(o => h("tr", null, h("td", null, o.kod), h("td", null, o.aciklama), h("td", null, (o.parca || "…") + "P" + (o.kaset || "…") + "K"), h("td", null, o.not || "")))))) : null]),
      (m.yapilacaklar || []).length ? [h("h3", null, "Makroskopi kontrol listesi"), h("ul", null, m.yapilacaklar.map(y => h("li", null, y)))] : null,
      (m.ek_materyaller || []).length ? [h("h3", null, "Ayrı kapta gelebilecek materyaller"),
        m.ek_materyaller.map(r => { const md = MOD[r]; return h("div", {class:"fb"}, h("h4", null, md.ad), h("pre", null, cap(makroToken(md.alanlar, null, true)(md.metin))), (md.yapilacaklar || []).length ? h("ul", null, md.yapilacaklar.map(y => h("li", null, y))) : null); })] : null));
  }

    h("h1", {style:"font-family:var(--sans)"}, s.baslik + " — rehber"),
    h("div", {class:"tools", style:"font-family:var(--sans);margin:10px 0"}, h("a", {class:"btn primary", href:"#/s/" + s.id}, "Şablonu aç"),
      h("button", {type:"button", class:"btn", onclick:() => printDoc(s.baslik + " — rehber", s._sistem + " · " + GRUP[s._grup], read.cloneNode(true), true)}, "Rehberi yazdır")),
    body);
  const toc = h("nav", {class:"toc", "aria-label":"Rehber bölümleri"}, secs.map(([id, t]) => h("a", {href:"#g-" + id, onclick:e => { e.preventDefault(); document.getElementById("g-" + id).scrollIntoView({behavior:"smooth"}); }}, t)));
  app.append(h("div", {class:"guide"}, toc, read));
}

/* ---------- router ---------- */
function route(){
  const p = (location.hash.slice(1) || "/").split("/");
  if (p[1] === "s" && BY[p[2]]) renderSablon(BY[p[2]]);
  else if (p[1] === "r" && BY[p[2]]) renderRehber(BY[p[2]]);
  else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
})();
